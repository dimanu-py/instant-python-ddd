name: Release and Publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.released.outputs.released }}
      tag: ${{ steps.released.outputs.tag }}

    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔖 Create release
        id: released
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.0.2
        with:
          build: true
          push: true
          changelog: true
          commit: true
          tag: true
          vcs_release: true
          config_file: pyproject.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_email: ${{ vars.GIT_COMMITTER_EMAIL }}
          git_committer_name: ${{ vars.GIT_COMMITTER_NAME }}
          ssh_public_signing_key: ${{ vars.SSH_PUBLIC_SIGNING_KEY }}
          ssh_private_signing_key: ${{ secrets.SSH_PRIVATE_SIGNING_KEY }}

  build-and-publish:
    name: Publish to PyPI
    needs:
      - release
    if: needs.release.outputs.released == 'true' || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - name: 🛠️ Setup environment
        uses: ./.github/actions/setup_environment

      - name: 🏃 Build package
        run: task dev:build

      - name: 🚀 Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  build-binaries:
    name: Build binary (${{ matrix.target }})
    needs:
      - release
    if: needs.release.outputs.released == 'true' || github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: 🛡️ Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: 📥 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: 🛠️ Setup environment
        uses: ./.github/actions/setup_environment

      - name: 🏃 Build binary
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: uvx hatch build -t binary

      - name: 📦 Rename binary for release
        shell: bash
        run: mv dist/binary/ipy-* dist/binary/ipy-${{ matrix.target }}${{ matrix.ext }}

      - name: 📤 Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release.outputs.tag }} dist/binary/ipy-${{ matrix.target }}${{ matrix.ext }} --clobber
