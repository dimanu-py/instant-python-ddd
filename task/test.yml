version: '3'

tasks:
  all:
    desc: Run all tests
    cmds:
      - printf "\n⌛ Running tests...\n"
      - uv run pytest tests -ra

  unit:
    desc: Run all unit tests
    cmds:
      - printf "\n⌛ Running unit tests...\n"
      - uv run pytest -m "unit" -ra

  integration:
    desc: Run all integration tests
    cmds:
      - printf "\n⌛ Running integration tests...\n"
      - uv run pytest -m "integration" -ra

  acceptance:
    desc: Run all acceptance tests
    cmds:
      - printf "\n⌛ Running acceptance tests...\n"
      - uv run pytest -m "acceptance" -ra

  watch:
    desc: Run all tests with every change
    cmds:
      - printf "\n⌛ Running tests in watch mode...\n"
      - uv run ptw --runner "pytest -n auto test -ra"

  tox:
    desc: Run tox tests
    cmds:
      - uv run tox

  mutate:
    desc: 'Run mutation testing (optional: MUTATE_PATH="instant_python.<module>.*", dotted module pattern).'
    cmds:
      - printf "⌛ Running mutation testing...\n\n"
      - uv run mutmut run {{.MUTATE_PATH}}
      - uv run mutmut results
